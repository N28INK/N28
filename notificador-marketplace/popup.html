<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificador Marketplace</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
<h1>🔔 Notificador Marketplace</h1>
<div id="config" class="box">…</div>
<div id="mponly" class="box warn" hidden>
  <div>⚠️ Solo avisa de chats de <b>Marketplace</b>. Los chats normales de Messenger NO te llegan al teléfono.</div>
  <button id="mpoff" class="secondary">Avisar de todos los chats</button>
</div>
<div id="acct" class="box">…</div>
<div id="watch" class="box">…</div>
<div id="last" class="hint"></div>
<div id="events" class="events" aria-label="Últimos eventos"></div>
<button id="test">Probar aviso</button>
<div id="result" class="result" role="status" aria-live="polite"></div>
<button id="openInbox" class="secondary">Abrir mis chats de Facebook</button>
<button id="openOptions" class="secondary">Configuración</button>
<button id="openDiag" class="secondary">No me llegan avisos (diagnóstico)</button>
<script src="popup.js"></script>
</body>
</html>
